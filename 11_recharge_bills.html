<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>EveryonePay - Recharge and Bills</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="screen">
  <div class="header"><i class="ti ti-arrow-left back"></i><span class="title">Recharge and bill pay</span></div>
  <div style="padding:14px 16px;"><div class="input-bar"><i class="ti ti-search"></i><span>Search billers, operators</span></div></div>

  <div class="section">
    <p class="section-title">Recharge</p>
    <div class="grid-4">
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-device-mobile" style="color:#E8975E;"></i></div><span class="grid-label small">Mobile</span></div>
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-wifi" style="color:#E8975E;"></i></div><span class="grid-label small">Broadband</span></div>
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-device-tv" style="color:#E8975E;"></i></div><span class="grid-label small">DTH</span></div>
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-router" style="color:#E8975E;"></i></div><span class="grid-label small">Fastag</span></div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Bill payments</p>
    <div class="grid-4">
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-bulb" style="color:#E8975E;"></i></div><span class="grid-label small">Electricity</span></div>
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-droplet" style="color:#E8975E;"></i></div><span class="grid-label small">Water</span></div>
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-flame" style="color:#E8975E;"></i></div><span class="grid-label small">Gas</span></div>
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-credit-card" style="color:#E8975E;"></i></div><span class="grid-label small">Card bill</span></div>
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-shield" style="color:#E8975E;"></i></div><span class="grid-label small">Insurance</span></div>
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-building" style="color:#E8975E;"></i></div><span class="grid-label small">Rent</span></div>
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-school" style="color:#E8975E;"></i></div><span class="grid-label small">Education</span></div>
      <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-car" style="color:#E8975E;"></i></div><span class="grid-label small">Fuel card</span></div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Recent billers</p>
    <div class="list-row"><div class="list-row-left"><div class="icon-tile"><i class="ti ti-bulb"></i></div><div><p class="row-title">UP power corp</p><p class="row-sub">Last paid &#8377;1,240</p></div></div><i class="ti ti-chevron-right muted"></i></div>
    <div class="list-row"><div class="list-row-left"><div class="icon-tile"><i class="ti ti-device-mobile"></i></div><div><p class="row-title">Jio prepaid</p><p class="row-sub">Last recharge &#8377;299</p></div></div><i class="ti ti-chevron-right muted"></i></div>
  </div>
</div>
</body>
</html>
