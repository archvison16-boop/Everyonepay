<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - Cards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="header">
    <i class="ti ti-arrow-left back"></i>
    <span class="title">Cards</span>
    <i class="ti ti-plus action"></i>
  </div>

  <div class="section">
    <div style="background:linear-gradient(135deg,#D9622E,#8A1A12); border-radius:18px; padding:20px; position:relative; overflow:hidden; height:170px;">
      <div class="logo-row" style="margin-bottom:24px;">
        <svg width="26" height="20" viewBox="0 0 86 64" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 14 C16 14 5 23 5 36 C5 49 16 58 30 58 C40 58 47 53 51 45 L41 41 C39 45 35 48 30 48 C23 48 18 44 16 38 L52 38" stroke="#FFE3DA" stroke-width="9" fill="none" stroke-linecap="round"/>
          <path d="M59 58 L59 14 C68 14 76 22 76 32 C76 42 68 50 59 50 C53 50 48 47 45 42" stroke="#FFE3DA" stroke-width="9" fill="none" stroke-linecap="round"/>
        </svg>
        <span style="color:#FFE3DA;">EveryonePay</span>
      </div>
      <p style="color:#FFE3DA; font-size:18px; letter-spacing:2px; margin:0 0 14px;">5241 &nbsp; 8842 &nbsp; •••• &nbsp; 7720</p>
      <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <p style="color:#FFD9CC; font-size:9px; margin:0;">CARD HOLDER</p>
          <p style="color:#FFE3DA; font-size:13px; margin:2px 0 0;">RAHUL KHANNA</p>
        </div>
        <div>
          <p style="color:#FFD9CC; font-size:9px; margin:0;">EXPIRES</p>
          <p style="color:#FFE3DA; font-size:13px; margin:2px 0 0;">08/29</p>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Saved cards</p>
    <div class="list-row">
      <div class="list-row-left">
        <div class="icon-tile"><i class="ti ti-credit-card"></i></div>
        <div>
          <p class="row-title">HDFC Debit •• 7720</p>
          <p class="row-sub">Expires 08/29</p>
        </div>
      </div>
      <i class="ti ti-dots-vertical muted"></i>
    </div>
    <div class="list-row">
      <div class="list-row-left">
        <div class="icon-tile"><i class="ti ti-credit-card"></i></div>
        <div>
          <p class="row-title">ICICI Credit •• 3391</p>
          <p class="row-sub">Expires 02/28</p>
        </div>
      </div>
      <i class="ti ti-dots-vertical muted"></i>
    </div>
  </div>

  <div class="section">
    <div class="btn-secondary">
      <i class="ti ti-plus" style="color:#D9622E;"></i>
      <span>Add new card</span>
    </div>
  </div>
</div>
</body>
</html>
