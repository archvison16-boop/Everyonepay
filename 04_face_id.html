<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - Face ID</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div style="padding:60px 24px 0; display:flex; flex-direction:column; align-items:center;">

  </div>

  <div style="padding:48px 24px 0; display:flex; flex-direction:column; align-items:center;">
    <svg width="76" height="76" viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
      <circle cx="38" cy="38" r="36" fill="#2A1A14" stroke="#3D2419" stroke-width="1"/>
      <path d="M22 22 L22 16 Q22 12 26 12 L32 12" stroke="#E8975E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M54 22 L54 16 Q54 12 50 12 L44 12" stroke="#E8975E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M22 54 L22 60 Q22 64 26 64 L32 64" stroke="#E8975E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M54 54 L54 60 Q54 64 50 64 L44 64" stroke="#E8975E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="29" cy="32" r="2" fill="#D9622E"/>
      <circle cx="47" cy="32" r="2" fill="#D9622E"/>
      <path d="M38 32 L38 44 Q38 47 41 47" stroke="#D9622E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M28 51 Q38 57 48 51" stroke="#D9622E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </svg>
    <p style="color:#E8E0D8; font-size:15px; font-weight:500; margin:18px 0 4px;">Face ID</p>
    <p class="muted" style="font-size:12px; margin:0; text-align:center;">Look at your phone to login<br>to EveryonePay</p>

  <div style="padding:36px 24px 0; display:flex; justify-content:center;">
    <div style="display:flex; align-items:center; gap:8px; padding:11px 20px; border-radius:14px; border:0.5px solid #3D2419;">
      <i class="ti ti-keyboard muted"></i>
      <span class="muted" style="font-size:12px;">Enter passcode instead</span>
    </div>
  </div>

  <div style="padding:60px 24px 24px; text-align:center;">
    <p style="color:#5F4A40; font-size:10px; margin:0; line-height:1.6;">Face ID data is processed securely on your device and never sent to EveryonePay servers</p>
  </div>
</div>
</body>
</html>
