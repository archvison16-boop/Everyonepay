<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>EveryonePay - Profile</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="screen">
  <div style="background:#251713; padding:22px 18px 26px; display:flex; flex-direction:column; align-items:center; text-align:center;">
    <img src="https://i.pravatar.cc/120?img=12" alt="Profile" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:2.5px solid #D9622E;margin-bottom:10px;">
    <p style="color:#F2E4DC; font-size:17px; font-weight:500; margin:0;">Rahul Khanna</p>
    <p class="muted" style="font-size:12px; margin:4px 0 0;">9876543210 &middot; rahul@everyonepay</p>
    <div style="display:flex; align-items:center; gap:6px; margin-top:10px; background:#1F3A2A; padding:5px 12px; border-radius:14px;">
      <i class="ti ti-shield-check" style="color:#7DAE8C; font-size:14px;"></i>
      <span style="color:#7DAE8C; font-size:11px;">KYC verified</span>
    </div>
  </div>

  <div style="padding:16px 16px 0; display:grid; grid-template-columns:repeat(2,1fr); gap:10px;">
    <div class="card"><p class="muted" style="font-size:11px; margin:0 0 4px;">Wallet balance</p><p style="color:#F2E4DC; font-size:16px; font-weight:500; margin:0;">&#8377;12,480.50</p></div>
    <div class="card"><p class="muted" style="font-size:11px; margin:0 0 4px;">Rewards earned</p><p style="color:#FFC78A; font-size:16px; font-weight:500; margin:0;">428 pts</p></div>
  </div>

  <div class="section">
    <p class="section-title">Account</p>
    <div style="background:#251713; border-radius:14px; border:0.5px solid #2E1F1A; overflow:hidden;">
      <div class="list-row" style="padding:13px 14px;"><div class="list-row-left"><i class="ti ti-building-bank" style="color:#D9622E;"></i><span class="row-title">Linked bank accounts</span></div><i class="ti ti-chevron-right muted"></i></div>
      <div class="list-row" style="padding:13px 14px;"><div class="list-row-left"><i class="ti ti-credit-card" style="color:#D9622E;"></i><span class="row-title">Cards</span></div><i class="ti ti-chevron-right muted"></i></div>
      <div class="list-row" style="padding:13px 14px;"><div class="list-row-left"><i class="ti ti-key" style="color:#D9622E;"></i><span class="row-title">UPI PIN and security</span></div><i class="ti ti-chevron-right muted"></i></div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Preferences</p>
    <div style="background:#251713; border-radius:14px; border:0.5px solid #2E1F1A; overflow:hidden;">
      <div class="list-row" style="padding:13px 14px;"><div class="list-row-left"><i class="ti ti-bell" style="color:#D9622E;"></i><span class="row-title">Notifications</span></div><i class="ti ti-chevron-right muted"></i></div>
      <div class="list-row" style="padding:13px 14px;"><div class="list-row-left"><i class="ti ti-moon" style="color:#D9622E;"></i><span class="row-title">Appearance</span></div><span class="muted" style="font-size:12px;">Dark</span></div>
      <div class="list-row" style="padding:13px 14px;"><div class="list-row-left"><i class="ti ti-language" style="color:#D9622E;"></i><span class="row-title">App language</span></div><span class="muted" style="font-size:12px;">English</span></div>
      <div class="list-row" style="padding:13px 14px;"><div class="list-row-left"><i class="ti ti-headset" style="color:#D9622E;"></i><span class="row-title">Help and support</span></div><i class="ti ti-chevron-right muted"></i></div>
    </div>
  </div>

  <div class="section" style="padding-bottom:20px;">
    <div style="display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border-radius:14px; border:0.5px solid #4A1F16; color:#D9622E; font-size:13px;"><i class="ti ti-logout"></i><span>Log out</span></div>
  </div>
</div>
</body>
</html>
