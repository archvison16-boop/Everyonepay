<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - Send to Bank Account</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="header">
    <i class="ti ti-arrow-left back"></i>
    <span class="title">Transfer to bank account</span>
  </div>

  <div style="padding:20px 16px 0;">
    <label class="muted" style="font-size:11px; display:block; margin-bottom:6px;">Account number</label>
    <div class="input-bar" style="margin-bottom:14px;">
      <i class="ti ti-building-bank"></i>
      <span style="color:#F2E4DC;">5021 4789 6630</span>
    </div>

    <label class="muted" style="font-size:11px; display:block; margin-bottom:6px;">Confirm account number</label>
    <div class="input-bar" style="margin-bottom:14px;">
      <i class="ti ti-building-bank"></i>
      <span style="color:#F2E4DC;">5021 4789 6630</span>
    </div>

    <label class="muted" style="font-size:11px; display:block; margin-bottom:6px;">IFSC code</label>
    <div class="input-bar" style="margin-bottom:14px;">
      <i class="ti ti-hash"></i>
      <span style="color:#F2E4DC;">HDFC0001234</span>
    </div>

    <label class="muted" style="font-size:11px; display:block; margin-bottom:6px;">Account holder name</label>
    <div class="input-bar">
      <i class="ti ti-user"></i>
      <span style="color:#F2E4DC;">Vikram Singh</span>
    </div>
  </div>

  <div class="section">
    <div style="display:flex; align-items:center; gap:10px; background:#3D2419; border-radius:14px; padding:13px 14px; border:0.5px solid #4A2C12;">
      <i class="ti ti-info-circle" style="color:#E8975E; font-size:18px;"></i>
      <p style="color:#D9AC9B; font-size:11px; margin:0; line-height:1.5;">Name will be auto-verified once you proceed. Double check account number before transferring.</p>
    </div>
  </div>

  <div class="section" style="margin-top:6px;">
    <p class="section-title">Recent transfers to this type</p>
    <div class="list-row">
      <div class="list-row-left">
        <div class="icon-tile"><i class="ti ti-building-bank"></i></div>
        <div>
          <p class="row-title">Vikram Singh</p>
          <p class="row-sub">•• 6630 &middot; HDFC0001234</p>
        </div>
      </div>
      <i class="ti ti-chevron-right muted"></i>
    </div>
    <div class="list-row">
      <div class="list-row-left">
        <div class="icon-tile"><i class="ti ti-building-bank"></i></div>
        <div>
          <p class="row-title">Landlord rent account</p>
          <p class="row-sub">•• 2284 &middot; SBIN0009876</p>
        </div>
      </div>
      <i class="ti ti-chevron-right muted"></i>
    </div>
  </div>

  <div style="padding:18px 16px 22px; position:absolute; bottom:0; left:0; right:0;">
    <div class="btn-primary">Continue</div>
  </div>
</div>
</body>
</html>
