<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - Send to Mobile Number</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="header">
    <i class="ti ti-arrow-left back"></i>
    <span class="title">Send via mobile number</span>
  </div>

  <div style="padding:20px 16px 0;">
    <label class="muted" style="font-size:11px; display:block; margin-bottom:6px;">Mobile number</label>
    <div class="input-bar">
      <span style="color:#D9AC9B;">+91</span>
      <span style="color:#3D2419;">|</span>
      <span style="color:#F2E4DC; flex:1;">91234 56780</span>
      <i class="ti ti-address-book" style="color:#D9622E;"></i>
    </div>
  </div>

  <div class="section" style="margin-top:6px;">
    <div style="display:flex; align-items:center; gap:10px; background:#2A1A14; border-radius:14px; padding:13px 14px; border:0.5px solid #3D2419;">
      <div style="width:38px; height:38px; border-radius:50%; background:#D9622E; display:flex; align-items:center; justify-content:center; color:#2A1206; font-size:13px; font-weight:500;">AK</div>
      <div>
        <p class="row-title">Amit Kumar</p>
        <p class="row-sub">Registered on EveryonePay</p>
      </div>
      <i class="ti ti-circle-check-filled" style="color:#7DAE8C; font-size:18px; margin-left:auto;"></i>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Recent</p>
    <div class="list-row">
      <div class="list-row-left">
        <div style="width:36px; height:36px; border-radius:50%; background:#8A1A12; display:flex; align-items:center; justify-content:center; color:#FFE3DA; font-size:12px;">SV</div>
        <div>
          <p class="row-title">Sneha Verma</p>
          <p class="row-sub">90123 45678</p>
        </div>
      </div>
      <i class="ti ti-chevron-right muted"></i>
    </div>
    <div class="list-row">
      <div class="list-row-left">
        <div style="width:36px; height:36px; border-radius:50%; background:#3D2410; display:flex; align-items:center; justify-content:center; color:#FFC78A; font-size:12px;">RS</div>
        <div>
          <p class="row-title">Rahul Sharma</p>
          <p class="row-sub">98765 43210</p>
        </div>
      </div>
      <i class="ti ti-chevron-right muted"></i>
    </div>
  </div>

  <div style="padding:18px 16px 22px; position:absolute; bottom:0; left:0; right:0;">
    <div class="btn-primary">Continue to pay</div>
  </div>
</div>
</body>
</html>
