<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - Set UPI PIN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="header">
    <i class="ti ti-arrow-left back"></i>
    <span class="title">Set UPI PIN</span>
  </div>

  <div style="padding:28px 24px 0; display:flex; flex-direction:column; align-items:center;">
    <div class="icon-tile" style="width:42px; height:42px; margin-bottom:10px;"><i class="ti ti-lock" style="font-size:19px;"></i></div>
    <p style="color:#F2E4DC; font-size:14px; margin:0;">HDFC bank •• 4521</p>
    <p class="muted" style="font-size:12px; margin:4px 0 0; text-align:center;">Create a 4-digit UPI PIN to secure your payments</p>
  </div>

  <div style="padding:24px 24px 0; text-align:center;">
    <p class="muted" style="font-size:11px; margin:0 0 10px;">Enter new PIN</p>
    <div style="display:flex; justify-content:center; gap:14px; margin-bottom:24px;">
      <div style="width:14px; height:14px; border-radius:50%; background:#D9622E;"></div>
      <div style="width:14px; height:14px; border-radius:50%; background:#D9622E;"></div>
      <div style="width:14px; height:14px; border-radius:50%; background:#3D2419; border:1px solid #4A2C12;"></div>
      <div style="width:14px; height:14px; border-radius:50%; background:#3D2419; border:1px solid #4A2C12;"></div>
    </div>
    <p class="muted" style="font-size:11px; margin:0 0 10px;">Confirm PIN</p>
    <div style="display:flex; justify-content:center; gap:14px;">
      <div style="width:14px; height:14px; border-radius:50%; background:#3D2419; border:1px solid #4A2C12;"></div>
      <div style="width:14px; height:14px; border-radius:50%; background:#3D2419; border:1px solid #4A2C12;"></div>
      <div style="width:14px; height:14px; border-radius:50%; background:#3D2419; border:1px solid #4A2C12;"></div>
      <div style="width:14px; height:14px; border-radius:50%; background:#3D2419; border:1px solid #4A2C12;"></div>
    </div>
  </div>

  <div style="padding:30px 28px 0;">
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:14px; text-align:center;">
      <div style="padding:14px 0; color:#F2E4DC; font-size:18px; background:#2A1A14; border-radius:10px;">1</div>
      <div style="padding:14px 0; color:#F2E4DC; font-size:18px; background:#2A1A14; border-radius:10px;">2</div>
      <div style="padding:14px 0; color:#F2E4DC; font-size:18px; background:#2A1A14; border-radius:10px;">3</div>
      <div style="padding:14px 0; color:#F2E4DC; font-size:18px; background:#2A1A14; border-radius:10px;">4</div>
      <div style="padding:14px 0; color:#F2E4DC; font-size:18px; background:#2A1A14; border-radius:10px;">5</div>
      <div style="padding:14px 0; color:#F2E4DC; font-size:18px; background:#2A1A14; border-radius:10px;">6</div>
      <div style="padding:14px 0; color:#F2E4DC; font-size:18px; background:#2A1A14; border-radius:10px;">7</div>
      <div style="padding:14px 0; color:#F2E4DC; font-size:18px; background:#2A1A14; border-radius:10px;">8</div>
      <div style="padding:14px 0; color:#F2E4DC; font-size:18px; background:#2A1A14; border-radius:10px;">9</div>
      <div></div>
      <div style="padding:14px 0; color:#F2E4DC; font-size:18px; background:#2A1A14; border-radius:10px;">0</div>
      <div style="padding:14px 0; display:flex; align-items:center; justify-content:center;"><i class="ti ti-backspace muted" style="font-size:18px;"></i></div>
    </div>
  </div>

  <div style="padding:26px 24px 0; text-align:center;">
    <p class="muted" style="font-size:10px;">Last 6 digits of your debit card and expiry will be required to verify</p>
  </div>
</div>
</body>
</html>
