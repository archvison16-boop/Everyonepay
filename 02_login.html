<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div style="padding:44px 24px 0; display:flex; flex-direction:column; align-items:center;">
    <svg width="58" height="44" viewBox="0 0 86 64" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 14 C16 14 5 23 5 36 C5 49 16 58 30 58 C40 58 47 53 51 45 L41 41 C39 45 35 48 30 48 C23 48 18 44 16 38 L52 38" stroke="#D9622E" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M59 58 L59 14 C68 14 76 22 76 32 C76 42 68 50 59 50 C53 50 48 47 45 42" stroke="#C8451F" stroke-width="9" fill="none" stroke-linecap="round"/>
    </svg>
    <p style="color:#C8451F; font-size:21px; font-weight:500; margin:10px 0 0;">EveryonePay</p>
    <p class="muted" style="font-size:12px; margin:6px 0 0;">Anytime, anywhere for everyone</p>
  </div>

  <div style="padding:30px 20px 0;">
    <p style="color:#F2E4DC; font-size:17px; font-weight:500; margin:0 0 4px;">Welcome back</p>
    <p class="muted" style="font-size:12px; margin:0 0 18px;">Login with your mobile number</p>
    <label class="muted" style="font-size:11px; display:block; margin-bottom:6px;">Mobile number</label>
    <div class="input-bar">
      <span style="color:#B89283;">+91</span>
      <span style="color:#3D2419;">|</span>
      <span style="color:#F2E4DC;">98765 43210</span>
    </div>
  </div>

  <div style="padding:16px 20px 0;"><div class="btn-primary">Send OTP</div></div>

  <div style="padding:16px 20px 0; display:flex; align-items:center; gap:10px;">
    <div style="flex:1; height:0.5px; background:#2E1F1A;"></div>
    <span class="muted" style="font-size:11px;">or continue with</span>
    <div style="flex:1; height:0.5px; background:#2E1F1A;"></div>
  </div>

  <div style="padding:14px 20px 0;">
    <div class="btn-secondary" style="background:#2A1A14;">
      <svg width="20" height="20" viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 22 L22 16 Q22 12 26 12 L32 12" stroke="#E8975E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M54 22 L54 16 Q54 12 50 12 L44 12" stroke="#E8975E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M22 54 L22 60 Q22 64 26 64 L32 64" stroke="#E8975E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M54 54 L54 60 Q54 64 50 64 L44 64" stroke="#E8975E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle cx="29" cy="32" r="2.8" fill="#D9622E"/>
        <circle cx="47" cy="32" r="2.8" fill="#D9622E"/>
        <path d="M38 32 L38 44 Q38 47 41 47" stroke="#D9622E" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M28 51 Q38 57 48 51" stroke="#D9622E" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
      <span style="color:#F2E4DC; font-weight:500;">Login with Face ID</span>
    </div>
  </div>

  <div style="padding:12px 20px 0; display:flex; gap:10px;">
    <div class="btn-secondary"><i class="ti ti-fingerprint" style="color:#D9622E;"></i><span>Touch ID</span></div>
    <div class="btn-secondary"><i class="ti ti-mail" style="color:#D9622E;"></i><span>Email</span></div>
  </div>

  <div style="padding:22px 20px 0; text-align:center;">
    <span class="muted" style="font-size:12px;">New to EveryonePay? </span>
    <span style="color:#D9622E; font-size:12px; font-weight:500;">Create account</span>
  </div>

  <div style="padding:20px 24px 22px; text-align:center;">
    <p style="color:#5F4A40; font-size:10px; margin:0; line-height:1.6;">By continuing, you agree to EveryonePay's terms of service and privacy policy</p>
  </div>
</div>
</body>
</html>
