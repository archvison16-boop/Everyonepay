<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - Mobile Recharge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="header">
    <i class="ti ti-arrow-left back"></i>
    <span class="title">Mobile recharge</span>
  </div>

  <div class="scrollpad">
    <div style="padding:18px 16px 0;">
      <div class="input-bar">
        <i class="ti ti-device-mobile"></i>
        <span style="color:#F2E4DC; flex:1;">98765 43210</span>
        <i class="ti ti-address-book" style="color:#D9622E;"></i>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Operator</p>
      <div class="flex-between" style="background:#2A1A14; border-radius:14px; padding:13px 14px; border:1.5px solid #D9622E;">
        <div class="list-row-left">
          <div class="icon-tile"><i class="ti ti-antenna"></i></div>
          <span class="row-title">Jio</span>
        </div>
        <i class="ti ti-chevron-down" style="color:#D9622E;"></i>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Circle</p>
      <div class="flex-between card">
        <span class="row-title">Uttar Pradesh (West)</span>
        <i class="ti ti-chevron-down muted"></i>
      </div>
    </div>

    <div class="section">
      <div class="flex-between" style="margin-bottom:12px;">
        <p class="section-title" style="margin:0;">Plan type</p>
      </div>
      <div style="display:flex; gap:10px;">
        <div style="flex:1; text-align:center; padding:10px 0; border-radius:12px; background:#3D2419; color:#FFC78A; font-size:12px; border:1.5px solid #D9622E;">Prepaid</div>
        <div style="flex:1; text-align:center; padding:10px 0; border-radius:12px; background:#2A1A14; color:#8C6457; font-size:12px; border:0.5px solid #3D2419;">Postpaid</div>
      </div>
    </div>

    <div class="section">
      <div class="flex-between" style="margin-bottom:12px;">
        <p class="section-title" style="margin:0;">Enter amount</p>
        <span class="section-link">Browse plans</span>
      </div>
      <div class="input-bar">
        <span style="color:#8C6457; font-size:16px;">&#8377;</span>
        <span style="color:#F2E4DC; font-size:16px; font-weight:500;">299</span>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Popular plans</p>
      <div class="list-row">
        <div>
          <p class="row-title">&#8377;239 &middot; 1.5GB/day</p>
          <p class="row-sub">28 days validity</p>
        </div>
        <span class="section-link">Select</span>
      </div>
      <div class="list-row">
        <div>
          <p class="row-title">&#8377;299 &middot; 2GB/day</p>
          <p class="row-sub">28 days validity</p>
        </div>
        <span class="section-link">Select</span>
      </div>
      <div class="list-row">
        <div>
          <p class="row-title">&#8377;599 &middot; 2.5GB/day</p>
          <p class="row-sub">84 days validity</p>
        </div>
        <span class="section-link">Select</span>
      </div>
    </div>
  </div>

  <div style="padding:16px 16px 22px;">
    <div class="btn-primary">Pay &#8377;299</div>
  </div>
</div>
</body>
</html>
