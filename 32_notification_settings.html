<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - Notification Settings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="header">
    <i class="ti ti-arrow-left back"></i>
    <span class="title">Notification settings</span>
  </div>

  <div class="section">
    <p class="section-title">Payments</p>
    <div class="list-row">
      <span class="row-title">Payment success alerts</span>
      <div style="width:40px; height:22px; border-radius:12px; background:#D9622E; position:relative;"><div style="width:18px; height:18px; border-radius:50%; background:#FFF; position:absolute; right:2px; top:2px;"></div></div>
    </div>
    <div class="list-row">
      <span class="row-title">Payment failure alerts</span>
      <div style="width:40px; height:22px; border-radius:12px; background:#D9622E; position:relative;"><div style="width:18px; height:18px; border-radius:50%; background:#FFF; position:absolute; right:2px; top:2px;"></div></div>
    </div>
    <div class="list-row">
      <span class="row-title">Money received alerts</span>
      <div style="width:40px; height:22px; border-radius:12px; background:#D9622E; position:relative;"><div style="width:18px; height:18px; border-radius:50%; background:#FFF; position:absolute; right:2px; top:2px;"></div></div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Bills and recharges</p>
    <div class="list-row">
      <span class="row-title">Bill due reminders</span>
      <div style="width:40px; height:22px; border-radius:12px; background:#D9622E; position:relative;"><div style="width:18px; height:18px; border-radius:50%; background:#FFF; position:absolute; right:2px; top:2px;"></div></div>
    </div>
    <div class="list-row">
      <span class="row-title">Recharge expiry reminders</span>
      <div style="width:40px; height:22px; border-radius:12px; background:#3D2419; position:relative; border:0.5px solid #4A2C12;"><div style="width:18px; height:18px; border-radius:50%; background:#8C6457; position:absolute; left:2px; top:2px;"></div></div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Offers and rewards</p>
    <div class="list-row">
      <span class="row-title">New offers and cashback</span>
      <div style="width:40px; height:22px; border-radius:12px; background:#D9622E; position:relative;"><div style="width:18px; height:18px; border-radius:50%; background:#FFF; position:absolute; right:2px; top:2px;"></div></div>
    </div>
    <div class="list-row">
      <span class="row-title">Scratch card alerts</span>
      <div style="width:40px; height:22px; border-radius:12px; background:#D9622E; position:relative;"><div style="width:18px; height:18px; border-radius:50%; background:#FFF; position:absolute; right:2px; top:2px;"></div></div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Security</p>
    <div class="list-row">
      <span class="row-title">New device login alerts</span>
      <div style="width:40px; height:22px; border-radius:12px; background:#D9622E; position:relative;"><div style="width:18px; height:18px; border-radius:50%; background:#FFF; position:absolute; right:2px; top:2px;"></div></div>
    </div>
  </div>
</div>
</body>
</html>
