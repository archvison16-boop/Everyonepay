<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>EveryonePay - Add Money</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="screen">
  <div class="header"><i class="ti ti-arrow-left back"></i><span class="title">Add money to wallet</span></div>

  <div style="padding:22px 16px 4px;">
    <p class="muted" style="font-size:12px; margin:0 0 6px; text-align:center;">Current balance</p>
    <p style="color:#F2E4DC; font-size:20px; font-weight:500; margin:0 0 20px; text-align:center;">&#8377;12,480.50</p>
    <div style="display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:18px;">
      <span class="muted" style="font-size:28px; font-weight:500;">&#8377;</span>
      <span style="color:#F2E4DC; font-size:42px; font-weight:500;">2,000</span>
    </div>
  </div>

  <div style="padding:0 16px 4px;">
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">
      <div style="text-align:center; padding:10px 0; border-radius:10px; background:#2A1A14; border:0.5px solid #3D2419; color:#B89283; font-size:12px;">&#8377;500</div>
      <div style="text-align:center; padding:10px 0; border-radius:10px; background:#3D2410; border:1.5px solid #D9622E; color:#FFC78A; font-size:12px;">&#8377;2,000</div>
      <div style="text-align:center; padding:10px 0; border-radius:10px; background:#2A1A14; border:0.5px solid #3D2419; color:#B89283; font-size:12px;">&#8377;5,000</div>
      <div style="text-align:center; padding:10px 0; border-radius:10px; background:#2A1A14; border:0.5px solid #3D2419; color:#B89283; font-size:12px;">&#8377;10,000</div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Add money using</p>
    <div class="list-row"><div class="list-row-left"><i class="ti ti-building-bank" style="color:#D9622E;"></i><div><p class="row-title">HDFC bank •• 4521</p><p class="row-sub">Linked account</p></div></div><div style="width:18px;height:18px;border-radius:50%;border:2px solid #D9622E;display:flex;align-items:center;justify-content:center;"><div style="width:9px;height:9px;border-radius:50%;background:#D9622E;"></div></div></div>
    <div class="list-row"><div class="list-row-left"><i class="ti ti-credit-card muted"></i><div><p class="muted" style="font-size:13px; margin:0;">Debit / credit card</p><p class="row-sub">Visa, Mastercard, Rupay</p></div></div><div style="width:18px;height:18px;border-radius:50%;border:2px solid #4A3528;"></div></div>
    <div class="list-row"><div class="list-row-left"><i class="ti ti-qrcode muted"></i><div><p class="muted" style="font-size:13px; margin:0;">UPI</p><p class="row-sub">Pay from any UPI app</p></div></div><div style="width:18px;height:18px;border-radius:50%;border:2px solid #4A3528;"></div></div>
  </div>

  <div style="padding:22px 16px 22px;"><div class="btn-primary">Add &#8377;2,000</div></div>
</div>
</body>
</html>
