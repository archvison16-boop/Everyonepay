<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>EveryonePay - Send Money</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="screen">
  <div class="header"><i class="ti ti-arrow-left back"></i><span class="title">Send money</span></div>
  <div style="padding:14px 16px;"><div class="input-bar"><i class="ti ti-search"></i><span>Enter UPI ID, number or name</span></div></div>
  <div style="padding:4px 16px 0; display:flex; gap:18px;">
    <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-scan" style="color:#E8975E;"></i></div><span class="grid-label small">Scan QR</span></div>
    <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-address-book" style="color:#E8975E;"></i></div><span class="grid-label small">Contacts</span></div>
    <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-building-bank" style="color:#E8975E;"></i></div><span class="grid-label small">Bank a/c</span></div>
    <div class="grid-item"><div class="grid-icon small" style="background:#2A1A14; border:0.5px solid #3D2419;"><i class="ti ti-users" style="color:#E8975E;"></i></div><span class="grid-label small">Self a/c</span></div>
  </div>
  <div class="section">
    <p class="section-title">Frequent contacts</p>
    <div class="list-row"><div class="list-row-left"><div style="width:38px;height:38px;border-radius:50%;background:#D9622E;display:flex;align-items:center;justify-content:center;color:#2A1206;font-size:13px;font-weight:500;">RS</div><div><p class="row-title">Rahul Sharma</p><p class="row-sub">9876543210</p></div></div><i class="ti ti-chevron-right muted"></i></div>
    <div class="list-row"><div class="list-row-left"><div style="width:38px;height:38px;border-radius:50%;background:#8A1A12;display:flex;align-items:center;justify-content:center;color:#FFE3DA;font-size:13px;font-weight:500;">PM</div><div><p class="row-title">Priya Mehta</p><p class="row-sub">priya@upi</p></div></div><i class="ti ti-chevron-right muted"></i></div>
    <div class="list-row"><div class="list-row-left"><div style="width:38px;height:38px;border-radius:50%;background:#3D2410;display:flex;align-items:center;justify-content:center;color:#FFC78A;font-size:13px;font-weight:500;">AK</div><div><p class="row-title">Amit Kumar</p><p class="row-sub">9123456780</p></div></div><i class="ti ti-chevron-right muted"></i></div>
  </div>
</div>
</body>
</html>
