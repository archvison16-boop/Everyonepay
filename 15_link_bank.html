<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>EveryonePay - Link Bank Account</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="screen">
  <div class="header"><i class="ti ti-arrow-left back"></i><span class="title">Link bank account</span></div>
  <div style="padding:14px 16px;"><div class="input-bar"><i class="ti ti-search"></i><span>Search your bank</span></div></div>

  <div class="section">
    <p class="section-title">Popular banks</p>
    <div class="list-row"><div class="list-row-left"><div class="icon-tile"><i class="ti ti-building-bank"></i></div><span class="row-title">HDFC bank</span></div><i class="ti ti-circle-check" style="color:#7DAE8C;"></i></div>
    <div class="list-row"><div class="list-row-left"><div class="icon-tile"><i class="ti ti-building-bank"></i></div><span class="row-title">State bank of India</span></div><i class="ti ti-chevron-right muted"></i></div>
    <div class="list-row"><div class="list-row-left"><div class="icon-tile"><i class="ti ti-building-bank"></i></div><span class="row-title">ICICI bank</span></div><i class="ti ti-chevron-right muted"></i></div>
    <div class="list-row"><div class="list-row-left"><div class="icon-tile"><i class="ti ti-building-bank"></i></div><span class="row-title">Axis bank</span></div><i class="ti ti-chevron-right muted"></i></div>
    <div class="list-row"><div class="list-row-left"><div class="icon-tile"><i class="ti ti-building-bank"></i></div><span class="row-title">Punjab national bank</span></div><i class="ti ti-chevron-right muted"></i></div>
    <div class="list-row"><div class="list-row-left"><div class="icon-tile" style="background:#2E211B;"><i class="ti ti-dots"></i></div><span class="row-title">View all banks</span></div><i class="ti ti-chevron-right muted"></i></div>
  </div>

  <div class="section">
    <div style="display:flex; align-items:flex-start; gap:10px; background:#2A1A14; border-radius:14px; padding:13px 14px; border:0.5px solid #3D2419;">
      <i class="ti ti-shield-lock" style="color:#7DAE8C; font-size:18px; margin-top:1px;"></i>
      <p class="muted" style="font-size:11px; margin:0; line-height:1.5;">Your bank details are encrypted and never shared. EveryonePay is RBI compliant and uses bank-grade security.</p>
    </div>
  </div>
</div>
</body>
</html>
