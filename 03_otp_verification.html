<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - OTP Verification</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="header"><i class="ti ti-arrow-left back"></i><span class="title">Verify your number</span></div>

  <div style="padding:28px 24px 0;">
    <p style="color:#F2E4DC; font-size:15px; margin:0 0 4px;">Enter the 6-digit OTP</p>
    <p class="muted" style="font-size:12px; margin:0;">Sent to +91 98765 43210</p>
  </div>

  <div style="padding:24px 24px 0; display:flex; justify-content:space-between; gap:8px;">
    <div style="width:42px; height:50px; border-radius:10px; background:#2A1A14; border:1.5px solid #D9622E; display:flex; align-items:center; justify-content:center; color:#F2E4DC; font-size:18px; font-weight:500;">4</div>
    <div style="width:42px; height:50px; border-radius:10px; background:#2A1A14; border:1.5px solid #D9622E; display:flex; align-items:center; justify-content:center; color:#F2E4DC; font-size:18px; font-weight:500;">7</div>
    <div style="width:42px; height:50px; border-radius:10px; background:#2A1A14; border:1.5px solid #D9622E; display:flex; align-items:center; justify-content:center; color:#F2E4DC; font-size:18px; font-weight:500;">2</div>
    <div style="width:42px; height:50px; border-radius:10px; background:#2A1A14; border:0.5px solid #3D2419;"></div>
    <div style="width:42px; height:50px; border-radius:10px; background:#2A1A14; border:0.5px solid #3D2419;"></div>
    <div style="width:42px; height:50px; border-radius:10px; background:#2A1A14; border:0.5px solid #3D2419;"></div>
  </div>

  <div style="padding:16px 24px 0;">
    <span class="muted" style="font-size:12px;">Resend OTP in </span>
    <span style="color:#D9622E; font-size:12px; font-weight:500;">00:28</span>
  </div>

  <div style="padding:28px 20px 0;"><div class="btn-primary">Verify and continue</div></div>

  <div style="padding:16px 20px 0; text-align:center;">
    <span class="muted" style="font-size:12px;">Wrong number? </span>
    <span style="color:#D9622E; font-size:12px; font-weight:500;">Edit</span>
  </div>

  <div style="padding:40px 24px 24px; display:flex; align-items:center; gap:10px; background:#251713; margin-top:8px;">
    <i class="ti ti-shield-check" style="color:#7DAE8C; font-size:18px;"></i>
    <p class="muted" style="font-size:11px; margin:0; line-height:1.5;">Your OTP is encrypted and never stored on our servers</p>
  </div>
</div>
</body>
</html>
