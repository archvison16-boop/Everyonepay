<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>EveryonePay - Bank Balance Result</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="screen">
  <div class="header"><i class="ti ti-arrow-left back"></i><span class="title">Bank balance</span></div>

  <div class="section">
    <div class="card" style="text-align:center; padding:22px 16px;">
      <div class="icon-tile" style="width:46px; height:46px; border-radius:10px; margin:0 auto 12px;"><i class="ti ti-building-bank" style="font-size:22px;"></i></div>
      <p class="muted" style="font-size:12px; margin:0 0 4px;">HDFC bank •• 4521</p>
      <p class="muted" style="font-size:11px; margin:0 0 10px;">Savings account</p>
      <p style="color:#F2E4DC; font-size:30px; font-weight:500; margin:0;">&#8377;84,962.15</p>
      <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:10px;">
        <i class="ti ti-circle-check-filled" style="color:#7DAE8C; font-size:14px;"></i>
        <span style="color:#7DAE8C; font-size:11px;">Verified just now</span>
      </div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Available across accounts</p>
    <div class="list-row" style="padding:13px 14px; background:#2A1A14; border-radius:14px; border:0.5px solid #3D2419; margin-bottom:10px;"><div class="list-row-left"><i class="ti ti-wallet" style="color:#E8975E;"></i><span class="row-title">EveryonePay wallet</span></div><span style="color:#F2E4DC; font-size:13px; font-weight:500;">&#8377;12,480.50</span></div>
    <div class="list-row" style="padding:13px 14px; background:#2A1A14; border-radius:14px; border:1.5px solid #D9622E; margin-bottom:10px;"><div class="list-row-left"><i class="ti ti-building-bank" style="color:#E8975E;"></i><span class="row-title">HDFC bank •• 4521</span></div><span style="color:#F2E4DC; font-size:13px; font-weight:500;">&#8377;84,962.15</span></div>
    <div class="list-row" style="padding:13px 14px; background:#2A1A14; border-radius:14px; border:0.5px solid #3D2419;"><div class="list-row-left"><i class="ti ti-building-bank muted"></i><span class="muted" style="font-size:13px;">SBI •• 7790</span></div><span style="color:#D9622E; font-size:11px;">Check</span></div>
  </div>

  <div style="padding:22px 16px 22px;"><div class="btn-secondary"><i class="ti ti-refresh" style="color:#D9622E;"></i><span>Refresh balance</span></div></div>
</div>
</body>
</html>
