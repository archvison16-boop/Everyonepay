<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - Payment Failed</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div style="padding:48px 24px 0; display:flex; flex-direction:column; align-items:center;">
    <div style="width:64px; height:64px; border-radius:50%; background:#7A2A23; display:flex; align-items:center; justify-content:center; margin-bottom:18px;">
      <i class="ti ti-x" style="color:#FBEAEA; font-size:30px;"></i>
    </div>
    <p style="color:#F2E4DC; font-size:20px; font-weight:500; margin:0;">&#8377;250 payment failed</p>
    <p class="muted" style="font-size:13px; margin:6px 0 0;">to Amit Kumar</p>
  </div>

  <div class="section">
    <div class="card">
      <div class="list-row"><span class="muted" style="font-size:12px;">Transaction ID</span><span style="color:#D9AC9B; font-size:12px;">EP2606200642109</span></div>
      <div class="list-row"><span class="muted" style="font-size:12px;">Date and time</span><span style="color:#D9AC9B; font-size:12px;">20 Jun, 6:40 pm</span></div>
      <div class="list-row"><span class="muted" style="font-size:12px;">Reason</span><span style="color:#E8975E; font-size:12px;">Bank server timeout</span></div>
      <div class="list-row"><span class="muted" style="font-size:12px;">Status</span><span style="color:#E27272; font-size:12px;">Failed</span></div>
    </div>
  </div>

  <div class="section">
    <div style="display:flex; align-items:flex-start; gap:10px; background:#3D2419; border-radius:14px; padding:13px 14px; border:0.5px solid #4A2C12;">
      <i class="ti ti-info-circle" style="color:#E8975E; font-size:18px; margin-top:1px;"></i>
      <p style="color:#D9AC9B; font-size:11px; margin:0; line-height:1.5;">If any amount was debited from your account, it will be auto-refunded within 3-5 business days.</p>
    </div>
  </div>

  <div style="padding:22px 16px 0;">
    <div class="btn-primary">Try again</div>
  </div>
  <div style="padding:12px 16px 0;">
    <div class="btn-secondary">
      <i class="ti ti-headset" style="color:#D9622E;"></i>
      <span>Get help with this payment</span>
    </div>
  </div>
</div>
</body>
</html>
