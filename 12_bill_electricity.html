<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>EveryonePay - Electricity Bill</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="screen">
  <div class="header"><i class="ti ti-arrow-left back"></i><span class="title">Electricity bill</span></div>

  <div style="padding:20px 16px 0; display:flex; flex-direction:column; align-items:center;">
    <div class="icon-tile" style="width:54px; height:54px; border-radius:14px; margin-bottom:10px;"><i class="ti ti-bulb" style="font-size:24px;"></i></div>
    <p style="color:#F2E4DC; font-size:14px; margin:0;">UP power corporation</p>
    <p class="muted" style="font-size:12px; margin:2px 0 0;">Consumer no. 8847291056</p>
  </div>

  <div class="section">
    <div class="card">
      <div class="list-row"><span class="muted" style="font-size:12px;">Bill number</span><span style="color:#D9AC9B; font-size:12px;">UPPC0620061245</span></div>
      <div class="list-row"><span class="muted" style="font-size:12px;">Billing period</span><span style="color:#D9AC9B; font-size:12px;">May 2026</span></div>
      <div class="list-row"><span class="muted" style="font-size:12px;">Due date</span><span style="color:#E8975E; font-size:12px;">25 Jun 2026</span></div>
      <div class="list-row"><span style="color:#D9AC9B; font-size:13px;">Amount due</span><span style="color:#F2E4DC; font-size:16px; font-weight:500;">&#8377;1,240</span></div>
    </div>
  </div>

  <div class="section">
    <div style="display:flex; align-items:center; gap:10px; background:#3D2410; border-radius:14px; padding:12px 14px; border:0.5px solid #4A2C12;">
      <i class="ti ti-discount-2" style="color:#FFC78A;"></i>
      <span style="color:#FFC78A; font-size:12px; flex:1;">Get &#8377;20 cashback on this bill</span>
      <span style="color:#D9622E; font-size:11px;">Apply</span>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Pay using</p>
    <div class="list-row"><div class="list-row-left"><i class="ti ti-wallet" style="color:#D9622E;"></i><span class="row-title">EveryonePay wallet</span></div><div style="width:18px;height:18px;border-radius:50%;border:2px solid #D9622E;display:flex;align-items:center;justify-content:center;"><div style="width:9px;height:9px;border-radius:50%;background:#D9622E;"></div></div></div>
  </div>

  <div class="section">
    <div style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" checked style="width:16px;height:16px;accent-color:#D9622E;">
      <span class="muted" style="font-size:11px;">Enable autopay for this biller</span>
    </div>
  </div>

  <div style="padding:16px 16px 22px;"><div class="btn-primary">Pay &#8377;1,220</div></div>
</div>
</body>
</html>
