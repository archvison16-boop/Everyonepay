<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>EveryonePay - Balance Check</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="screen">
  <div class="header"><i class="ti ti-arrow-left back"></i><span class="title">Check balance</span></div>

  <div class="section">
    <div class="card" style="text-align:center; padding:20px 16px;">
      <div style="width:46px;height:46px;border-radius:50%;background:#3D2419;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;"><i class="ti ti-wallet" style="color:#E8975E; font-size:22px;"></i></div>
      <p class="muted" style="font-size:12px; margin:0 0 6px;">EveryonePay wallet</p>
      <p style="color:#F2E4DC; font-size:28px; font-weight:500; margin:0;">&#8377;12,480.50</p>
      <p class="muted" style="font-size:10px; margin:8px 0 0;">Updated just now</p>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Linked bank accounts</p>
    <div class="list-row" style="padding:13px 14px; background:#2A1A14; border-radius:14px; border:0.5px solid #3D2419; margin-bottom:10px;"><div class="list-row-left"><i class="ti ti-building-bank" style="color:#E8975E;"></i><div><p class="row-title">HDFC bank •• 4521</p><p class="row-sub">Savings account</p></div></div><span style="color:#D9622E; font-size:11px;">Check</span></div>
    <div class="list-row" style="padding:13px 14px; background:#2A1A14; border-radius:14px; border:0.5px solid #3D2419;"><div class="list-row-left"><i class="ti ti-building-bank" style="color:#E8975E;"></i><div><p class="row-title">SBI •• 7790</p><p class="row-sub">Savings account</p></div></div><span style="color:#D9622E; font-size:11px;">Check</span></div>
  </div>

  <div class="section">
    <div style="display:flex; align-items:center; gap:10px; background:#3D2419; border-radius:14px; padding:13px 14px; border:0.5px solid #4A2C12;">
      <i class="ti ti-shield-lock" style="color:#7DAE8C;"></i>
      <p style="color:#D9AC9B; font-size:11px; margin:0;">Bank balance requires UPI PIN verification for your security</p>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Quick links</p>
    <div class="list-row"><div class="list-row-left"><i class="ti ti-receipt" style="color:#E8975E;"></i><span class="row-title">View transaction history</span></div><i class="ti ti-chevron-right muted"></i></div>
    <div class="list-row"><div class="list-row-left"><i class="ti ti-plus" style="color:#E8975E;"></i><span class="row-title">Add money to wallet</span></div><i class="ti ti-chevron-right muted"></i></div>
  </div>
</div>
</body>
</html>
