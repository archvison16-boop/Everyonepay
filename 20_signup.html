<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - Create Account</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="header">
    <i class="ti ti-arrow-left back"></i>
    <span class="title">Create account</span>
  </div>

  <div style="padding:24px 20px 0;">
    <p style="color:#F2E4DC; font-size:17px; font-weight:500; margin:0 0 4px;">Let's get you started</p>
    <p class="muted" style="font-size:12px; margin:0 0 18px;">This will take less than 2 minutes</p>

    <label class="muted" style="font-size:11px; display:block; margin-bottom:6px;">Full name</label>
    <div class="input-bar" style="margin-bottom:14px;">
      <i class="ti ti-user"></i>
      <span style="color:#F2E4DC;">Rahul Khanna</span>
    </div>

    <label class="muted" style="font-size:11px; display:block; margin-bottom:6px;">Mobile number</label>
    <div class="input-bar" style="margin-bottom:14px;">
      <span style="color:#D9AC9B;">+91</span>
      <span style="color:#3D2419;">|</span>
      <span style="color:#F2E4DC;">98765 43210</span>
    </div>

    <label class="muted" style="font-size:11px; display:block; margin-bottom:6px;">Email address</label>
    <div class="input-bar" style="margin-bottom:14px;">
      <i class="ti ti-mail"></i>
      <span style="color:#F2E4DC;">rahul@email.com</span>
    </div>

    <label class="muted" style="font-size:11px; display:block; margin-bottom:6px;">Date of birth</label>
    <div class="input-bar">
      <i class="ti ti-calendar"></i>
      <span style="color:#F2E4DC;">DD / MM / YYYY</span>
    </div>
  </div>

  <div style="padding:22px 20px 0; display:flex; align-items:flex-start; gap:8px;">
    <input type="checkbox" checked style="width:16px; height:16px; accent-color:#D9622E; margin-top:1px;">
    <span class="muted" style="font-size:11px; line-height:1.5;">I agree to EveryonePay's terms of service, privacy policy and consent to KYC verification</span>
  </div>

  <div style="padding:20px 20px 0;">
    <div class="btn-primary">Continue</div>
  </div>

  <div style="padding:18px 20px 0; text-align:center;">
    <span class="muted" style="font-size:12px;">Already have an account? </span>
    <span style="color:#D9622E; font-size:12px; font-weight:500;">Login</span>
  </div>
</div>
</body>
</html>
