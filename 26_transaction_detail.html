<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EveryonePay - Transaction Detail</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="header">
    <i class="ti ti-arrow-left back"></i>
    <span class="title">Transaction details</span>
    <i class="ti ti-share action"></i>
  </div>

  <div style="padding:30px 24px 0; display:flex; flex-direction:column; align-items:center;">
    <div style="width:54px; height:54px; border-radius:50%; background:#E8351F; display:flex; align-items:center; justify-content:center; color:#FFE3DA; font-size:18px; font-weight:500;">RS</div>
    <p style="color:#F2E4DC; font-size:20px; font-weight:500; margin:14px 0 2px;">&#8377;500.00</p>
    <p class="muted" style="font-size:12px;">Paid to Rahul Sharma</p>
    <div style="display:flex; align-items:center; gap:6px; margin-top:10px; background:#1F3A2A; padding:5px 12px; border-radius:14px;">
      <i class="ti ti-circle-check-filled" style="color:#7DAE8C; font-size:14px;"></i>
      <span style="color:#7DAE8C; font-size:11px;">Successful</span>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <div class="list-row"><span class="muted" style="font-size:12px;">Transaction ID</span><span style="color:#D9AC9B; font-size:12px;">EP2606210945871</span></div>
      <div class="list-row"><span class="muted" style="font-size:12px;">UTR number</span><span style="color:#D9AC9B; font-size:12px;">309217458632</span></div>
      <div class="list-row"><span class="muted" style="font-size:12px;">Date and time</span><span style="color:#D9AC9B; font-size:12px;">21 Jun 2026, 4:32 pm</span></div>
      <div class="list-row"><span class="muted" style="font-size:12px;">Paid via</span><span style="color:#D9AC9B; font-size:12px;">EveryonePay wallet</span></div>
      <div class="list-row"><span class="muted" style="font-size:12px;">To UPI ID</span><span style="color:#D9AC9B; font-size:12px;">rahul@upi</span></div>
      <div class="list-row"><span class="muted" style="font-size:12px;">Note</span><span style="color:#D9AC9B; font-size:12px;">Dinner split</span></div>
    </div>
  </div>

  <div class="section" style="display:flex; gap:10px;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; background:#2A1A14; border-radius:14px; border:0.5px solid #3D2419;">
      <i class="ti ti-download" style="color:#D9622E; font-size:19px;"></i>
      <span style="color:#D9AC9B; font-size:11px;">Download</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; background:#2A1A14; border-radius:14px; border:0.5px solid #3D2419;">
      <i class="ti ti-headset" style="color:#D9622E; font-size:19px;"></i>
      <span style="color:#D9AC9B; font-size:11px;">Get help</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; background:#2A1A14; border-radius:14px; border:0.5px solid #3D2419;">
      <i class="ti ti-repeat" style="color:#D9622E; font-size:19px;"></i>
      <span style="color:#D9AC9B; font-size:11px;">Pay again</span>
    </div>
  </div>
</div>
</body>
</html>
